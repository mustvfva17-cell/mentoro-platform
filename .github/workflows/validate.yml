name: Validate platform

on:
  pull_request:
    branches:
      - main
      - feat/trainee-auth-foundation
  push:
    branches:
      - main
      - feat/trainee-auth-foundation

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production assets
        run: npm run build
