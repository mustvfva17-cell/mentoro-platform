name: Validate platform

on:
  pull_request:
    branches:
      - main
      - chore/recover-migration-history
      - feat/mentor-workspace-mvp
      - feat/admin-workspace-mvp
      - feat/enrollment-lifecycle-controls
  push:
    branches:
      - main
      - chore/recover-migration-history
      - feat/admin-workspace-mvp
      - feat/logbook-template-drafts

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Install pinned Chromium smoke-test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate migration filename/content history
        run: npm run check:migrations
      - name: Validate frontend/schema contracts
        run: npm run check:contracts
      - name: Verify enrollment lifecycle monitor behavior
        run: node scripts/test-enrollment-lifecycle-monitor.mjs
      - name: Build production assets
        run: npm run build
      - name: Verify HTML logbook read-only behavior in Chromium
        run: node scripts/test-logbook-readonly-browser.mjs
