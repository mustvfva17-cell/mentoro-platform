name: Validate platform

on:
  pull_request:
    branches:
      - main
      - chore/recover-migration-history
  push:
    branches:
      - main
      - chore/recover-migration-history

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Export npm-generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: mentoro-package-lock-bootstrap
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Validate migration filename/content history
        run: npm run check:migrations
      - name: Validate frontend/schema contracts
        run: npm run check:contracts
      - name: Build production assets
        run: npm run build
