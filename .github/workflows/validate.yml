name: Validate platform

on:
  pull_request:
    branches:
      - main
      - chore/recover-migration-history
  push:
    branches:
      - main
      - chore/recover-migration-history

permissions:
  contents: read

jobs:
  bootstrap-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/chore/recover-migration-history'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v7
        with:
          ref: chore/recover-migration-history
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only the generated lockfile
        run: |
          git add -- package-lock.json
          if git diff --cached --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add npm-generated lockfile"
          git push origin HEAD:chore/recover-migration-history

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate migration filename/content history
        run: npm run check:migrations
      - name: Validate frontend/schema contracts
        run: npm run check:contracts
      - name: Build production assets
        run: npm run build
